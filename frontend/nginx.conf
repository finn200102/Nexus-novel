# Access log without URL credentials: Kobo device tokens and personal feed
# tokens sit in the path, one-time links (password reset, sign-in callback)
# in the query. Everything else is logged as nginx's default "combined".
map $request_uri $nexus_loggable_uri {
    ~^(?<nx_kobo>/api/kobo/)[^/?]+(?<nx_rest>.*)$ $nx_kobo***$nx_rest;
    ~^(?<nx_feed>/api/feeds/)[^/?]+$ $nx_feed***;
    ~^(?<nx_path>[^?]*)\?.*(token|code|state)= $nx_path?***;
    default $request_uri;
}

log_format nexus_redacted '$remote_addr - $remote_user [$time_local] "$request_method $nexus_loggable_uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log nexus_redacted;
    root /usr/share/nginx/html;
    index index.html;

    # Docker service IPs change whenever novel-api is recreated. Resolve the
    # service name through Docker DNS for each short-lived upstream connection
    # instead of pinning the address discovered when Nginx started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $novel_api_upstream http://novel-api:8000;

    # Service-to-service webhooks are only for the Compose network.
    location ^~ /api/novel/internal/ {
        return 404;
    }

    # Live site search waits on the shared per-site limiter and, for
    # Cloudflare sites, FlareSolverr; the API bounds it at 45 s and then
    # reports a per-site timeout. EPUB imports upload up to 100 files; a
    # Calibre metadata.db (20 MB) and a data-export restore arrive as JSON
    # bodies far above nginx's 1 MB default as well.
    location ~ ^/api/(discovery/live|imports/(epub|calibre)$|me/import$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $novel_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_connect_timeout 3s;
        proxy_send_timeout 120s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $novel_api_upstream;
        proxy_set_header Host $host;
        # The API rate-limits sign-in per address; this replaces any value a
        # client sent, so it cannot be spoofed through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $host drops the port; single sign-on derives its callback URL from this.
        proxy_set_header X-Forwarded-Host $http_host;
        # The API returns bounded source failures itself. These limits prevent
        # a lost upstream connection from leaving the browser spinner active.
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    # HTML and the service worker must always be revalidated after a deploy.
    # Vite fingerprints the asset filenames, so cached JS/CSS remains safe.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
