[project]
name = "backend"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apprise>=2.0.1",
    "authlib>=1.6",
    "bcrypt>=4.3.0",
    "config>=0.5.1",
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "nltk>=3.9.1",
    "pipreqs>=0.5.0",
    "psycopg2>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydub>=0.25.1",
    "python-jose[cryptography]>=3.5.0",
    "pywebpush>=2.5.0",
    "sqlalchemy>=2.0.41",
    "structlog>=25.5.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
