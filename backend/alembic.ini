# Alembic configuration for the Nexus Novel database.
#
# The database URL comes from DATABASE_URL (see alembic/env.py). The API and
# worker run `upgrade head` on start through app.db_migrations; use the CLI to
# write new revisions:
#
#   uv run alembic revision --autogenerate -m "add something"
#   uv run alembic heads   # must print exactly one head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
